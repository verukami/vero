<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WYRD prototype — Verónica Martínez</title>
  <meta name="description" content="Clickable prototype of WYRD, a messaging app with fast chats and slow letters." />

  <script defer src="https://cloud.umami.is/script.js" data-website-id="6849f1a9-3081-4167-981d-b2495c49043b"></script>

  <meta property="og:title" content="WYRD prototype — Verónica Martínez" />
  <meta property="og:description" content="Clickable prototype of WYRD, a messaging app with fast chats and slow letters." />
  <meta property="og:image" content="https://verukami.github.io/vero/projects/wyrd/assets/images/01-splash.webp" />
  <link rel="canonical" href="https://verukami.github.io/vero/projects/wyrd/prototype/" />
  <link rel="icon" type="image/png" href="../../../assets/images/favicon.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root { --void: #0c0420; --ink: #f3effd; --muted: #a497c9; --neon: #00ff47; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background:
        radial-gradient(50% 60% at 50% 100%, rgba(0, 255, 71, 0.16), transparent 70%),
        radial-gradient(40% 50% at 15% 10%, rgba(101, 48, 184, 0.35), transparent 70%),
        var(--void);
      color: var(--ink);
      font-family: "Space Grotesk", system-ui, sans-serif;
      display: grid;
      grid-template-rows: auto 1fr auto;
      min-height: 100svh;
    }
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 16px;
    }
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 9px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.04);
      color: var(--ink);
      font: 600 14px/1 "Space Grotesk", sans-serif;
      text-decoration: none;
      cursor: pointer;
    }
    .pill:hover, .pill:focus-visible { border-color: var(--neon); color: var(--neon); outline: none; }
    .stage { display: grid; place-items: center; padding: 8px 16px 16px; min-height: 0; }
    .phone {
      --scale: 1;
      position: relative;
      width: calc(390px * var(--scale));
      height: calc(844px * var(--scale));
      border-radius: calc(46px * var(--scale));
      overflow: hidden;
      box-shadow: 0 0 0 10px #16101f, 0 0 0 11px rgba(255, 255, 255, 0.1), 0 40px 80px rgba(0, 0, 0, 0.55);
      background: var(--void);
    }
    /* two stacked frames: the next screen loads in the back one, then slides or fades in */
    .stack {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      transform: scale(var(--scale));
      transform-origin: top left;
    }
    .stack iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: var(--void);
    }
    .stack iframe.is-back { visibility: hidden; z-index: 0; }
    .stack iframe.is-front { z-index: 1; }
    .stack iframe.is-leaving { z-index: 1; }
    .stack iframe.is-entering { z-index: 2; box-shadow: -18px 0 40px rgba(0, 0, 0, 0.35); }
    .hint { margin: 0; padding: 0 16px 20px; text-align: center; color: var(--muted); font-size: 13px; }

    /* on a real phone, the prototype takes the whole screen */
    @media (max-width: 480px) {
      body { display: block; }
      .bar { position: fixed; top: auto; bottom: 12px; left: 0; right: 0; z-index: 2; pointer-events: none; }
      .bar .pill { pointer-events: auto; background: rgba(12, 4, 32, 0.85); backdrop-filter: blur(8px); }
      .stage { padding: 0; }
      .phone { width: 100vw; height: 100svh; border-radius: 0; box-shadow: none; }
      .stack { width: 100%; height: 100%; transform: none; }
      .hint { display: none; }
    }
  </style>
</head>
<body>
  <div class="bar">
    <a class="pill" href="../index.html">← Case study</a>
    <button class="pill" type="button" id="restart">↺ Start over</button>
  </div>

  <main class="stage">
    <div class="phone" id="phone">
      <div class="stack">
        <iframe class="is-front" src="01-splash.html" title="WYRD app prototype"></iframe>
        <iframe class="is-back" title="WYRD app prototype" tabindex="-1" aria-hidden="true"></iframe>
      </div>
    </div>
  </main>

  <p class="hint">Tap around like it's your phone. Every screen is from the final V2 design.</p>

  <script>
    const phone = document.getElementById("phone");
    const frames = [...document.querySelectorAll(".stack iframe")];
    let front = frames[0];
    let back = frames[1];
    let busy = false;
    let trail = ["01-splash.html"]; // screens visited, to know when a link means "go back"

    // Screens that are tabs of the same place fade instead of sliding
    const TAB_GROUPS = [
      ["07-feed.html", "08-coven.html", "09-profile.html"],
      ["17-chat-channel.html", "18-chat-drops.html"],
      ["19-grimoire-kept.html", "20-grimoire-in-transit.html"],
    ];
    const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
    const EASE = "cubic-bezier(.2, .8, .2, 1)";

    const fileOf = (win) => win.location.pathname.split("/").pop();

    function kindOf(from, to) {
      if (reduceMotion.matches) return "fade";
      if (TAB_GROUPS.some((g) => g.includes(from) && g.includes(to))) return "fade";
      if (to === trail[trail.length - 2]) return "back";
      return "push";
    }

    // Catch every link inside a screen and animate it instead of a hard cut
    function hook(frame) {
      const doc = frame.contentDocument;
      if (!doc) return;
      doc.addEventListener("click", (e) => {
        const a = e.target.closest("a[href]");
        if (!a) return;
        const href = a.getAttribute("href");
        if (/^(https?:|mailto:|tel:|#)/.test(href)) return;
        e.preventDefault();
        go(href);
      }, true);
    }

    function go(href, forced) {
      if (busy) return;
      const from = fileOf(front.contentWindow);
      const to = href.split("/").pop();
      if (to === from) return;
      const kind = forced || kindOf(from, to);
      busy = true;

      back.addEventListener("load", function onLoad() {
        back.removeEventListener("load", onLoad);
        hook(back);
        animate(kind).then(() => {
          [front, back] = [back, front];
          front.className = "is-front";
          front.removeAttribute("aria-hidden");
          front.removeAttribute("tabindex");
          back.className = "is-back";
          back.setAttribute("aria-hidden", "true");
          back.setAttribute("tabindex", "-1");
          back.contentWindow.location.replace("about:blank");
          if (kind === "back") trail.pop();
          else if (forced === "fade" && to === "01-splash.html") trail = [to];
          else trail.push(to);
          busy = false;
        });
      });
      // replace() keeps the browser's own back button out of it
      back.contentWindow.location.replace(href);
    }

    function animate(kind) {
      const inFrame = back;
      const outFrame = front;
      inFrame.className = "is-entering";
      outFrame.className = "is-leaving";
      const opts = { duration: kind === "fade" ? 260 : 420, easing: EASE, fill: "both" };

      let a, b;
      if (kind === "fade") {
        inFrame.style.boxShadow = "none";
        a = inFrame.animate([{ opacity: 0 }, { opacity: 1 }], opts);
        b = outFrame.animate([{ opacity: 1 }, { opacity: 1 }], opts);
      } else if (kind === "back") {
        // the current screen slides away to the right, the previous one comes back from the left
        outFrame.style.zIndex = 3;
        a = outFrame.animate([{ transform: "translateX(0)" }, { transform: "translateX(100%)" }], opts);
        b = inFrame.animate(
          [{ transform: "translateX(-28%)", filter: "brightness(.6)" }, { transform: "translateX(0)", filter: "brightness(1)" }],
          opts
        );
      } else {
        a = inFrame.animate([{ transform: "translateX(100%)" }, { transform: "translateX(0)" }], opts);
        b = outFrame.animate(
          [{ transform: "translateX(0)", filter: "brightness(1)" }, { transform: "translateX(-28%)", filter: "brightness(.6)" }],
          opts
        );
      }
      return Promise.all([a.finished, b.finished]).then(() => {
        a.cancel();
        b.cancel();
        inFrame.style.boxShadow = "";
        outFrame.style.zIndex = "";
      });
    }

    front.addEventListener("load", () => hook(front), { once: true });
    if (front.contentDocument && front.contentDocument.readyState === "complete") hook(front);

    // Fit the 390 × 844 phone into the window without scrolling
    function fit() {
      if (innerWidth <= 480) { phone.style.setProperty("--scale", 1); return; }
      const room = innerHeight - 150;
      phone.style.setProperty("--scale", Math.min(1, Math.max(0.55, room / 844)).toFixed(3));
    }
    addEventListener("resize", fit);
    fit();

    document.getElementById("restart").addEventListener("click", () => {
      go("01-splash.html", "fade");
    });
  </script>
</body>
</html>
