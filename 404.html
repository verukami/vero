<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Lost in the bag · Verónica Martínez</title>
  <meta name="description" content="This page slipped out of the bag. Head back to Verónica Martínez's portfolio." />
  <meta name="robots" content="noindex" />

  <script defer src="https://cloud.umami.is/script.js" data-website-id="6849f1a9-3081-4167-981d-b2495c49043b"></script>

  <!-- GitHub Pages serves this file at any missing path, so every URL starts at /vero/ -->
  <link rel="icon" type="image/png" href="/vero/assets/images/favicon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Pixelify+Sans:wght@500&display=swap" rel="stylesheet" />

  <script>try { const t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) {}</script>

  <link rel="stylesheet" href="/vero/assets/styles/site.css" />

  <style>
    .lost {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 32px var(--gutter);
      align-items: center;
      min-height: calc(100svh - 60px);
      padding: clamp(32px, 6vh, 72px) var(--gutter);
      overflow: hidden;
    }
    .bag {
      position: relative;
      justify-self: center;
      width: min(100%, 460px);
    }
    .bag img {
      width: 100%;
      height: auto;
      transform-origin: 50% 20%;
      animation: dangle 6s ease-in-out infinite alternate;
      filter: drop-shadow(0 30px 40px rgba(40, 10, 90, 0.28));
      transition: filter 0.6s ease;
    }
    @keyframes dangle {
      from { transform: rotate(-3deg) translateY(0); }
      to   { transform: rotate(3deg) translateY(-10px); }
    }
    /* glow-in-the-dark: in dark mode the stars light up */
    :root[data-theme="dark"] .bag img {
      filter: drop-shadow(0 0 14px rgba(200, 255, 170, 0.35)) drop-shadow(0 0 40px rgba(184, 255, 60, 0.25));
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) .bag img {
        filter: drop-shadow(0 0 14px rgba(200, 255, 170, 0.35)) drop-shadow(0 0 40px rgba(184, 255, 60, 0.25));
      }
    }

    .lost h1 {
      margin: 16px 0 14px;
      font-size: clamp(38px, 5.4vw, 76px);
      font-weight: 600;
      line-height: 1;
      letter-spacing: -0.045em;
      max-width: 13ch;
    }
    .lost h1 em {
      font-style: normal;
      background: var(--holo);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .lost .lede { margin: 0; max-width: 40ch; font-size: clamp(17px, 1.5vw, 20px); color: var(--ink-soft); }
    .lost .ctas { margin-top: 28px; }
    .err { font-family: "Pixelify Sans", var(--mono); font-size: 15px; color: var(--accent-text); letter-spacing: 0.04em; }
    .path {
      margin-top: 22px;
      font-family: var(--mono);
      font-size: 12px;
      color: var(--ink-soft);
      overflow-wrap: anywhere;
    }

    /* a few loose stars that fell out of the bag */
    .loose { position: absolute; inset: 0; pointer-events: none; z-index: 0; }
    .loose i {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--s);
      aspect-ratio: 1;
      background: #d9f2c4;
      clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
      opacity: 0.8;
      animation: twinkle-star var(--t) ease-in-out infinite alternate;
    }
    :root[data-theme="dark"] .loose i { filter: drop-shadow(0 0 8px #b8ff3c); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .loose i { filter: drop-shadow(0 0 8px #b8ff3c); } }
    @keyframes twinkle-star { from { transform: rotate(0) scale(0.9); opacity: 0.5; } to { transform: rotate(20deg) scale(1.1); opacity: 0.95; } }
    .lost > .copy, .lost > .bag { position: relative; z-index: 1; }

    @media (max-width: 820px) {
      .lost { grid-template-columns: 1fr; text-align: left; }
      .bag { width: min(80%, 340px); order: -1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bag img, .loose i { animation: none; }
    }
  </style>
</head>

<body>

  <header class="nav">
    <a href="/vero/" class="brand" aria-label="Verónica Martínez, home">
      <img src="/vero/assets/images/miranda.gif" alt="" width="1054" height="188" />
    </a>
    <div class="nav-right">
    <nav aria-label="Main">
      <a href="/vero/#work">Work</a>
      <a href="/vero/#lab">Lab</a>
      <a href="/vero/about.html">About</a>
      <a href="/vero/cv/" class="hide-sm">Resume</a>
    </nav>
    <button class="theme-toggle" type="button" aria-label="Switch to dark mode"><span aria-hidden="true">☾</span></button>
    </div>
  </header>

  <main class="lost">
    <div class="loose" aria-hidden="true">
      <i style="--x:6%;  --y:14%; --s:22px; --t:3.2s"></i>
      <i style="--x:44%; --y:8%;  --s:14px; --t:2.6s"></i>
      <i style="--x:92%; --y:20%; --s:18px; --t:3.8s"></i>
      <i style="--x:86%; --y:84%; --s:26px; --t:2.9s"></i>
      <i style="--x:12%; --y:88%; --s:16px; --t:3.4s"></i>
      <i style="--x:52%; --y:92%; --s:12px; --t:2.2s"></i>
    </div>

    <div class="bag">
      <img src="/vero/assets/images/404-bag.webp" width="900" height="931"
           alt="A zip bag of stickers: a silver 404, a pixel dinosaur, a planet and glow-in-the-dark stars" />
    </div>

    <div class="copy">
      <span class="err">ERROR 404 · PAGE NOT FOUND</span>
      <h1>This page slipped out of <em>the bag.</em></h1>
      <p class="lede">
        Maybe it's still glowing somewhere in the dark. While it turns up, here's something real to look at.
      </p>
      <div class="ctas">
        <a href="/vero/" class="btn primary">Back home</a>
        <a href="/vero/#work" class="btn ghost">See the collection</a>
        <a href="mailto:veru.kami@gmail.com" class="btn link">Say hi ✉</a>
      </div>
      <p class="path" aria-live="polite">You looked for: <span id="lost-path">this page</span></p>
    </div>
  </main>

  <script src="/vero/assets/js/site.js"></script>
  <script>
    document.getElementById("lost-path").textContent = location.pathname;
  </script>
</body>
</html>
